name: deploy

# Rebuilds layoffmap.com (AWS Amplify, app d1rnj3kiay05gb, branch main) after every push to main
# and once a day, so date-relative numbers on the site stay current. Keep it to these two
# triggers: no manual, API-dispatched, reusable or "target" PR triggers, so nobody can start a
# run by hand. The IAM role trusts only workflows on this repo's main branch, and all it may do
# is start a build of the site's main branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Start the site build
        run: |
          aws amplify start-job --app-id d1rnj3kiay05gb --branch-name main --job-type RELEASE \
            --query 'jobSummary.{jobId:jobId,status:status}' --output text
